name: Deploy Humareso Design System

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.2.3)'
        required: false
        default: ''

env:
  REGISTRY_URL: https://npm.pkg.github.com
  NODE_VERSION: '18'
  # Non-secret infrastructure identifiers. These were repo secrets, which hid
  # them from review and let them drift out of step with the IAM policy that
  # names the very same bucket and distribution.
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::192172748462:role/humareso-design-ci
  S3_BUCKET: humareso-fe-assets
  CLOUDFRONT_DISTRIBUTION_ID: E29GXZ12E6YK67
  CLOUDFRONT_DOMAIN: cdn-hds.humareso.com

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          ls -la css/
          echo "Build verification complete"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: design-system-build
          path: |
            dist/
            css/
            fonts/
            package.json

  deploy-npm:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloudfront:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token for role assumption
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Static keys (secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, minted
      # 2025-08-18) are dead: STS rejects them with "security token ... is
      # invalid". Assume the purpose-built humareso-design-ci role via GitHub
      # OIDC instead, so there is no long-lived credential left to expire.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Create versioned directory
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          # css/ and fonts/ share a prefix, so a bare --delete on the css sync
          # wipes fonts/ and version.json before the next line puts them back.
          # Exclude them so the fonts are never briefly 404 on the CDN.
          SYNC_EXCLUDE=(--exclude 'fonts/*' --exclude 'version.json')

          # The @font-face rules use url('../fonts/...'), which is right for
          # the package layout (css/fonts.css sits next to fonts/) and wrong
          # here: the deploy flattens css/* into design-system/<v>/ alongside
          # design-system/<v>/fonts/, so '../fonts/' escapes the version prefix
          # and 403s. Rewrite to same-directory for the uploaded copy only, so
          # versioned CSS keeps pointing at versioned fonts. The repo keeps
          # '../fonts/' for git-dependency consumers.
          rm -rf .cdn-css && cp -R css .cdn-css
          sed -i "s|url('\.\./fonts/|url('fonts/|g" .cdn-css/*.css
          if grep -q "url('\.\./fonts/" .cdn-css/*.css; then
            echo "::error::font URL rewrite failed; CSS would 403 on the CDN"
            exit 1
          fi

          # Upload to S3 with versioning
          aws s3 sync .cdn-css/ s3://$S3_BUCKET/design-system/$VERSION/ --delete "${SYNC_EXCLUDE[@]}"
          aws s3 sync fonts/ s3://$S3_BUCKET/design-system/$VERSION/fonts/ --delete

          # Also upload to latest
          aws s3 sync .cdn-css/ s3://$S3_BUCKET/design-system/latest/ --delete "${SYNC_EXCLUDE[@]}"
          aws s3 sync fonts/ s3://$S3_BUCKET/design-system/latest/fonts/ --delete

          # Create version manifest
          echo "{\"version\":\"$VERSION\",\"timestamp\":\"$TIMESTAMP\",\"commit\":\"${{ github.sha }}\"}" > version.json
          aws s3 cp version.json s3://$S3_BUCKET/design-system/$VERSION/
          aws s3 cp version.json s3://$S3_BUCKET/design-system/latest/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/design-system/*"

      - name: Output CDN URLs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "�� Design System deployed to CloudFront!"
          echo "📦 Version: $VERSION"
          echo "🔗 Latest CSS: https://$CLOUDFRONT_DOMAIN/design-system/latest/humareso-design.css"
          echo "🔗 Versioned CSS: https://$CLOUDFRONT_DOMAIN/design-system/$VERSION/humareso-design.css"
          echo "🔗 Fonts: https://$CLOUDFRONT_DOMAIN/design-system/latest/fonts/"
